name: Build SOUL READER AD_ID fix 101
'on':
  push:
    branches:
    - feat/free-reading-ads-v100
    paths:
    - .github/workflows/build-ad-id-101.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: soul-reader-ad-id-101
  cancel-in-progress: false
jobs:
  billing-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 01afce97094a28ddcf90600cc30a03d4917b2293
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: server/package-lock.json
    - run: npm ci --ignore-scripts --no-fund
    - name: Verify billing backend
      run: npm test
    - name: Bundle Worker without deployment
      env:
        WRANGLER_SEND_METRICS: 'false'
      run: npx wrangler deploy --dry-run --config wrangler.example.jsonc --outdir "$RUNNER_TEMP/soul-billing-worker"
  android-internal-aab:
    needs: billing-server
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOUL_INTERNAL_VERSION_CODE: '101'
      ADS_MODE: live
      ADMOB_ANDROID_APP_ID: ''
      ADMOB_INTERSTITIAL_AD_UNIT_ID: ''
    steps:
    - name: Checkout project
      uses: actions/checkout@v4
      with:
        ref: 01afce97094a28ddcf90600cc30a03d4917b2293
        persist-credentials: false
    - name: Apply and verify the exact AD_ID source fix
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64\nimport gzip\nimport hashlib\nimport json\n\
        from pathlib import Path\nimport subprocess\n\nencoded = ''\n\
        expected_digest = '8b7af81086945d445fe2460edf86a252218402370efc9cb60d5c907a98677a4f'\nexpected_files\
        \ = {'.github/workflows/build-android.yml': 'a1269a76acb724473d0716082b00039f96dd686933a07cda7c3f76944f407cc3',\
        \ 'pubspec.yaml': '947c7e5dd196d51feb803398eccb37754ca4a5fc4b5718f9e2afd4432a7c97a9', 'scripts/configure_platforms.py':\
        \ 'e96c18492521faff7a68b58dd41600c37cd0ba54ee54abd91e648940c533371c', 'scripts/verify_first_play_bundle.py':\
        \ '495ccb840dc42054eea12efdec398ec2e0c802095df4a80d2c08e619bb442354', 'tests/test_ads_configuration.py':\
        \ '3846346dd9acb4d4b7f4a014020d0c6cd51e6438090ed10de60a042594a608df', 'tests/test_first_play_bundle.py':\
        \ '6c25fe42e37d3587d92798b87d2ffee75d8ab2780503f9c0c7fcb05fec15ba10'}\npatch = gzip.decompress(base64.b64decode(encoded,\
        \ validate=True))\nif hashlib.sha256(patch).hexdigest() != expected_digest:\n    raise SystemExit('AD_ID\
        \ source patch checksum mismatch.')\nfor check_only in (True, False):\n    command = ['git', 'apply',\
        \ '--check'] if check_only else ['git', 'apply']\n    subprocess.run(command + ['-'], input=patch,\
        \ check=True)\nfor name, expected in expected_files.items():\n    if hashlib.sha256(Path(name).read_bytes()).hexdigest()\
        \ != expected:\n        raise SystemExit('AD_ID source file checksum mismatch: ' + name)\nprovenance\
        \ = {\n    'sourceBaseCommit': '01afce97094a28ddcf90600cc30a03d4917b2293',\n    'sourcePatchSha256':\
        \ expected_digest,\n    'sourceFixReferenceCommit': '3833b939f8d679579b21fc282b70a5127fe46394',\n\
        \    'patchedSourceFilesSha256': expected_files,\n}\nPath('.ad-id-101-source.json').write_text(json.dumps(provenance,\
        \ indent=2) + '\\n')\nprint('Verified AD_ID source patch applied; final AAB still requires verification.')\n\
        PY\n"
    - name: Validate version and ads configuration before restoring the original key
      run: python3 scripts/ads_configuration.py --github-env --require-new-version
    - name: Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Restore and verify the original owner upload key privately
      env:
        SOUL_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SOUL_UPLOAD_KEYSTORE_BASE64 }}
        SOUL_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SOUL_UPLOAD_KEYSTORE_PASSWORD }}
        SOUL_UPLOAD_KEY_ALIAS: ${{ secrets.SOUL_UPLOAD_KEY_ALIAS }}
        SOUL_UPLOAD_KEY_PASSWORD: ${{ secrets.SOUL_UPLOAD_KEY_PASSWORD }}
        SOUL_UPLOAD_RECOVERY_ARCHIVE_BASE64: ${{ secrets.SOUL_UPLOAD_RECOVERY_ARCHIVE_BASE64 }}
        SOUL_UPLOAD_RECOVERY_PASSWORD: ${{ secrets.SOUL_UPLOAD_RECOVERY_PASSWORD }}
      run: python3 scripts/restore_upload_signing.py
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
    - name: Require the deployed billing configuration and authentication boundary
      run: node server/scripts/check-deployed-worker.mjs
    - name: Test release configuration and archive verification
      run: python3 -m unittest discover -s tests -p 'test_*.py' -v
    - name: Test purchase, photo and legal links in Chromium
      shell: bash
      run: 'set -euo pipefail

        npm install --ignore-scripts --prefix "$RUNNER_TEMP/legal-browser-test" playwright@1.57.0

        export NODE_PATH="$RUNNER_TEMP/legal-browser-test/node_modules"

        export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"

        test -n "$CHROMIUM_PATH"

        node tests/billing_ui.cjs

        node tests/free_reading_ads.cjs

        node tests/photo_bridge.cjs

        node tests/locales854.cjs

        node tests/legal_links.cjs

        node tests/review_access_ui.cjs

        node tests/review_setup_ui.cjs

        '
    - name: Setup Flutter stable
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - name: Generate Android and configure explicit upload signing
      run: 'set -euo pipefail

        java -m jdk.jartool/sun.security.tools.jarsigner.Main -help > /dev/null

        bash scripts/prepare_android.sh

        python3 scripts/restore_upload_signing.py --configure

        python3 scripts/verify_assets.py

        '
    - name: Analyze and test native app
      run: "set -euo pipefail\nfor check in analyze test; do\n  set +e\n  if [ \"$check\" = analyze ];\
        \ then\n    flutter analyze --no-fatal-infos > \"$RUNNER_TEMP/native-$check.log\" 2>&1\n  else\n\
        \    flutter test > \"$RUNNER_TEMP/native-$check.log\" 2>&1\n  fi\n  check_status=$?\n  set -e\n\
        \  cat \"$RUNNER_TEMP/native-$check.log\"\n  if [ \"$check_status\" -ne 0 ]; then\n    tail -n\
        \ 120 \"$RUNNER_TEMP/native-$check.log\" >> \"$GITHUB_STEP_SUMMARY\"\n    python3 - \"$RUNNER_TEMP/native-$check.log\"\
        \ <<'PYANN'\nimport re\nimport sys\nfrom pathlib import Path\nlog = Path(sys.argv[1]).read_text(errors='replace')\n\
        log = re.sub(r'\\x1b\\[[0-9;]*m', '', log)\nlines = [line.strip() for line in re.split(r'[\\r\\\
        n]+', log) if line.strip()]\nfor line in lines[-30:]:\n    message = line.replace('%', '%25').replace('\\\
        r', '%0D').replace('\\n', '%0A')\n    print('::error::' + message)\nPYANN\n    exit \"$check_status\"\
        \n  fi\ndone\n"
    - name: Build explicitly configured internal ads AAB with existing billing
      run: "set -euo pipefail\nflutter build appbundle --release --build-number=\"$SOUL_INTERNAL_VERSION_CODE\"\
        \ \\\n  --dart-define=BILLING_PACKAGE_NAME=com.soulreader.soul_reader \\\n  --dart-define=BILLING_VERIFIER_URL=https://soul-reader-billing.jgw98541706.workers.dev\
        \ \\\n  --dart-define=ADS_MODE=\"$ADS_MODE\" \\\n  --dart-define=ADMOB_ANDROID_APP_ID=\"$ADMOB_ANDROID_APP_ID\"\
        \ \\\n  --dart-define=ADMOB_INTERSTITIAL_AD_UNIT_ID=\"$ADMOB_INTERSTITIAL_AD_UNIT_ID\"\n"
    - name: Download and verify official bundletool
      run: "set -euo pipefail\ncurl --fail --location --retry 2 \\\n  https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar\
        \ \\\n  --output \"$RUNNER_TEMP/bundletool-all-1.18.2.jar\"\nprintf '%s  %s\\n' '378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584'\
        \ \\\n  \"$RUNNER_TEMP/bundletool-all-1.18.2.jar\" | sha256sum --check -\n"
    - name: Verify signed bundle and original audio
      run: "set -euo pipefail\npython3 scripts/verify_first_play_bundle.py \\\n  --bundle build/app/outputs/bundle/release/app-release.aab\
        \ \\\n  --bundletool \"$RUNNER_TEMP/bundletool-all-1.18.2.jar\" \\\n  --certificate \"$RUNNER_TEMP/soul-owner-upload-certificate.pem\"\
        \ \\\n  --version-code \"$SOUL_INTERNAL_VERSION_CODE\" \\\n  --ads-mode \"$ADS_MODE\" \\\n  --certificate-sha256\
        \ c4d31b29444fcd6fabea9ee91a01fd6bab3383a07079302e19ff32a1d7805139 \\\n  --output SOUL_READER_8.5.6_INTERNAL_${SOUL_ADS_ARTIFACT_LABEL}_BUILD_INFO.json\n"
    - name: Record patched-source provenance and verified AD_ID permission
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport json\nimport os\nfrom pathlib import Path\nreport\
        \ = Path('SOUL_READER_8.5.6_INTERNAL_LIVE_ADS_BUILD_INFO.json')\ninfo = json.loads(report.read_text())\n\
        if info.get('advertisingIdPermission') != 'com.google.android.gms.permission.AD_ID':\n    raise\
        \ SystemExit('Missing final AAB advertising ID permission verification.')\ninfo.pop('sourceCommit',\
        \ None)\ninfo.update(json.loads(Path('.ad-id-101-source.json').read_text()))\ninfo['workflowCommit']\
        \ = os.environ['GITHUB_SHA']\ninfo['sourcePreparation'] = 'pinned base plus checksum-verified\
        \ AD_ID patch'\nreport.write_text(json.dumps(info, indent=2) + '\\n')\nprint('Final AAB AD_ID\
        \ verification and exact source provenance recorded.')\nPY\n"
    - name: Stage only the internal AAB and checksum
      run: "set -euo pipefail\noutput=\"SOUL_READER_8.5.6_INTERNAL_${SOUL_ADS_ARTIFACT_LABEL}_${SOUL_INTERNAL_VERSION_CODE}.aab\"\
        \ncp build/app/outputs/bundle/release/app-release.aab \"$output\"\nsha256sum \"$output\" > \"\
        ${output}.sha256\"\nprintf 'Internal AAB version %s; AdsMode=%s. Original owner upload certificate\
        \ and 70 original audio files verified.\\n' \"$SOUL_INTERNAL_VERSION_CODE\" \"$ADS_MODE\" >> \"\
        $GITHUB_STEP_SUMMARY\"\nif [ \"$ADS_MODE\" = test ]; then\n  echo 'IsTest=true. Google test ads\
        \ only; this artifact does not monetize. Device consent, free-reading ad timing and billing still\
        \ require verification.' >> \"$GITHUB_STEP_SUMMARY\"\nelif [ \"$ADS_MODE\" = off ]; then\n  echo\
        \ 'Ads are off; this artifact does not monetize.' >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  echo 'Live\
        \ owner IDs configured. Ad serving, consent and monetization require owner AdMob approval and\
        \ device verification.' >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
    - name: Publish internal AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: SOUL_READER_8.5.6_INTERNAL_${{ env.SOUL_ADS_ARTIFACT_LABEL }}_${{ env.SOUL_INTERNAL_VERSION_CODE
          }}_AAB
        path: 'SOUL_READER_8.5.6_INTERNAL_${{ env.SOUL_ADS_ARTIFACT_LABEL }}_*.aab

          SOUL_READER_8.5.6_INTERNAL_${{ env.SOUL_ADS_ARTIFACT_LABEL }}_*.aab.sha256

          SOUL_READER_8.5.6_INTERNAL_${{ env.SOUL_ADS_ARTIFACT_LABEL }}_BUILD_INFO.json

          '
        if-no-files-found: error
        retention-days: 30
    - name: Remove private signing material
      if: always()
      run: ': "${RUNNER_TEMP:?}"

        rm -rf -- "$RUNNER_TEMP/soul-owner-upload-signing"

        rm -f "$RUNNER_TEMP/soul-play-upload.jks" android/key.properties

        '
