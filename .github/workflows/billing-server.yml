name: Verify billing server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.node-version'
      - '.github/workflows/billing-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  billing-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --include=dev --ignore-scripts --no-fund
      - run: npm test
      - name: Bundle configured Worker without deployment
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --no-install wrangler deploy --dry-run --config wrangler.jsonc --outdir "$RUNNER_TEMP/soul-billing-worker"
