name: Build SOUL READER 8.5.6 payment preparation APK

on:
  push:
    branches: [main, feat/play-billing-8.5.6]
  workflow_dispatch:
    inputs:
      artifact_type:
        description: Artifact to build (internal AAB keeps real purchases disabled)
        type: choice
        default: debug_apk
        options:
          - debug_apk
          - internal_aab
      version_code:
        description: Internal AAB version code, greater than any previous Play upload
        type: string
        default: '96'

permissions:
  contents: read

jobs:
  billing-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - name: Verify billing backend
        run: npm test
      - name: Bundle Worker without deployment
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --dry-run --config wrangler.example.jsonc --outdir "$RUNNER_TEMP/soul-billing-worker"

  android-debug-apk:
    if: github.event_name != 'workflow_dispatch' || inputs.artifact_type != 'internal_aab'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter stable (Dart 3.12 or newer required)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Print Flutter version
        run: flutter --version
      - name: Test release configuration and archive verification
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Prepare Android without changing Flutter sources
        run: bash scripts/prepare_android.sh
      - name: Verify original audio files
        run: python3 scripts/verify_assets.py
      - name: Test camera/gallery and ML Kit bridge in Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/photo-bridge-test" playwright@1.57.0
          export NODE_PATH="$RUNNER_TEMP/photo-bridge-test/node_modules"
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROMIUM_PATH"
          # paid855 replaces story75/ending80 tests for the retired fiction flow.
          node tests/billing_ui.cjs
          node tests/voice856.cjs
          node tests/paid855.cjs
          node tests/photo_bridge.cjs
          node tests/reading74.cjs
          node tests/guidance76.cjs
          node tests/tone78.cjs
          node tests/takeaway79.cjs
          node tests/concise81.cjs
          node tests/photo82.cjs
          node tests/reference83.cjs
          node tests/reference84.cjs
          node tests/topics853.cjs
          node tests/locales854.cjs
      - name: Verify integrated 8.5 reading script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("assets/web/index.html")
          html = p.read_text(encoding="utf-8")
          required = ["function sr85Report()", "${sr85Report()}", "류의 6가지 관상 풀이", "scan.source!=='mlkit'"]
          missing = [token for token in required if token not in html]
          if missing:
              raise SystemExit("ERROR: 8.5 integrated script missing from APK source: " + ", ".join(missing))
          print("8.5 integrated script verified")
          PY
      - name: Dart static analysis
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos > "$RUNNER_TEMP/analyze.log" 2>&1
          check_status=$?
          cat "$RUNNER_TEMP/analyze.log"
          if [ "$check_status" -ne 0 ]; then
            tail -n 160 "$RUNNER_TEMP/analyze.log" >> "$GITHUB_STEP_SUMMARY"
            python3 - "$RUNNER_TEMP/analyze.log" <<'PYANN'
          import sys
          from pathlib import Path
          lines = [line.strip() for line in Path(sys.argv[1]).read_text(errors='replace').splitlines() if line.strip()]
          for line in lines[-25:]:
              message = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + message)
          PYANN
          fi
          exit "$check_status"
      - name: Test ML Kit result validation
        shell: bash
        run: |
          set +e
          flutter test > "$RUNNER_TEMP/tests.log" 2>&1
          check_status=$?
          cat "$RUNNER_TEMP/tests.log"
          if [ "$check_status" -ne 0 ]; then
            tail -n 160 "$RUNNER_TEMP/tests.log" >> "$GITHUB_STEP_SUMMARY"
            python3 - "$RUNNER_TEMP/tests.log" <<'PYANN'
          import sys
          from pathlib import Path
          lines = [line.strip() for line in Path(sys.argv[1]).read_text(errors='replace').splitlines() if line.strip()]
          for line in lines[-25:]:
              message = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + message)
          PYANN
          fi
          exit "$check_status"
      - name: Validate release signing with a temporary CI-only key
        shell: bash
        env:
          SOUL_UPLOAD_KEYSTORE_PASSWORD: temporary-ci-only
          SOUL_UPLOAD_KEY_ALIAS: ci-only
          SOUL_UPLOAD_KEY_PASSWORD: temporary-ci-only
        run: |
          set -euo pipefail
          java -m jdk.jartool/sun.security.tools.jarsigner.Main -help > /dev/null
          export SOUL_UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/soul-ci-only.jks"
          cp android/app/build.gradle.kts "$RUNNER_TEMP/soul-before-signing-test.gradle.kts"
          cleanup_signing_test() {
            local restore_status=0
            cp "$RUNNER_TEMP/soul-before-signing-test.gradle.kts" android/app/build.gradle.kts || restore_status=$?
            rm -f "$SOUL_UPLOAD_KEYSTORE_PATH" android/key.properties build/app/outputs/bundle/release/app-release.aab
            return "$restore_status"
          }
          trap cleanup_signing_test EXIT
          keytool -genkeypair -keystore "$SOUL_UPLOAD_KEYSTORE_PATH" -storetype JKS \
            -alias "$SOUL_UPLOAD_KEY_ALIAS" -storepass:env SOUL_UPLOAD_KEYSTORE_PASSWORD \
            -keypass:env SOUL_UPLOAD_KEY_PASSWORD -keyalg RSA -keysize 2048 \
            -validity 1 -dname 'CN=SOUL READER CI ONLY'
          python3 scripts/configure_release_signing.py
          flutter build appbundle --release
          python3 scripts/verify_assets.py build/app/outputs/bundle/release/app-release.aab
          java -Duser.language=en -Duser.country=US -m jdk.jartool/sun.security.tools.jarsigner.Main -verify \
            build/app/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/soul-ci-signature.log" 2>&1
          grep -q '^jar verified\.$' "$RUNNER_TEMP/soul-ci-signature.log"
          if grep -qi 'unsigned entries' "$RUNNER_TEMP/soul-ci-signature.log"; then
            echo 'Temporary bundle contains unsigned entries.' >&2
            exit 1
          fi
          echo 'Temporary-key release compilation checked; its AAB and key are deleted, never published.' >> "$GITHUB_STEP_SUMMARY"
      - name: Build signed debug APK for Galaxy installation
        shell: bash
        run: |
          set +e
          flutter build apk --debug > "$RUNNER_TEMP/apk-build.log" 2>&1
          check_status=$?
          cat "$RUNNER_TEMP/apk-build.log"
          if [ "$check_status" -ne 0 ]; then
            tail -n 160 "$RUNNER_TEMP/apk-build.log" >> "$GITHUB_STEP_SUMMARY"
            python3 - "$RUNNER_TEMP/apk-build.log" <<'PYANN'
          import sys
          from pathlib import Path
          lines = [line.strip() for line in Path(sys.argv[1]).read_text(errors='replace').splitlines() if line.strip()]
          for line in lines[-25:]:
              message = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + message)
          PYANN
          fi
          exit "$check_status"
      - name: Verify APK audio and signature
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_assets.py build/app/outputs/flutter-apk/app-debug.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$apksigner" verify --verbose build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk SOUL_READER_8.5.6_PAYMENT_PREP.apk
          sha256sum SOUL_READER_8.5.6_PAYMENT_PREP.apk > SOUL_READER_8.5.6_PAYMENT_PREP.apk.sha256
      - name: Publish installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOUL_READER_8.5.6_PAYMENT_PREP_Galaxy_APK
          path: |
            SOUL_READER_8.5.6_PAYMENT_PREP.apk
            SOUL_READER_8.5.6_PAYMENT_PREP.apk.sha256
          if-no-files-found: error
          retention-days: 30

  android-internal-aab:
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_type == 'internal_aab'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOUL_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SOUL_UPLOAD_KEYSTORE_PASSWORD }}
      SOUL_UPLOAD_KEY_ALIAS: ${{ secrets.SOUL_UPLOAD_KEY_ALIAS }}
      SOUL_UPLOAD_KEY_PASSWORD: ${{ secrets.SOUL_UPLOAD_KEY_PASSWORD }}
      SOUL_INTERNAL_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Validate settings and decode private upload key outside checkout
        env:
          SOUL_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SOUL_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, binascii, os, re
          from pathlib import Path
          required = ['SOUL_UPLOAD_KEYSTORE_BASE64', 'SOUL_UPLOAD_KEYSTORE_PASSWORD',
                      'SOUL_UPLOAD_KEY_ALIAS', 'SOUL_UPLOAD_KEY_PASSWORD']
          for name in required:
              value = os.environ.get(name, '')
              if not value or any(c in value for c in '\r\n\0'):
                  raise SystemExit('Missing or invalid repository secret: ' + name)
          version = os.environ.get('SOUL_INTERNAL_VERSION_CODE', '')
          if not re.fullmatch(r'[1-9][0-9]{0,9}', version) or int(version) > 2100000000:
              raise SystemExit('version_code must be an integer from 1 to 2100000000')
          try:
              raw = base64.b64decode(os.environ['SOUL_UPLOAD_KEYSTORE_BASE64'], validate=True)
          except (ValueError, binascii.Error):
              raise SystemExit('Upload keystore secret must contain single-line base64')
          if not raw or len(raw) > 10 * 1024 * 1024:
              raise SystemExit('Upload keystore size is invalid')
          key = Path(os.environ['RUNNER_TEMP']) / 'soul-play-upload.jks'
          with key.open('xb') as output:
              os.fchmod(output.fileno(), 0o600)
              output.write(raw)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SOUL_UPLOAD_KEYSTORE_PATH=' + str(key) + '\n')
          print('Upload signing settings present. No credentials printed.')
          PY
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test release configuration and archive verification
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and configure explicit upload signing
        run: |
          set -euo pipefail
          java -m jdk.jartool/sun.security.tools.jarsigner.Main -help > /dev/null
          bash scripts/prepare_android.sh
          python3 scripts/configure_release_signing.py
          python3 scripts/verify_assets.py
      - name: Analyze and test native app
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build payment preparation AAB for internal testing
        run: |
          set -euo pipefail
          # No verifier URL or authenticated session is configured. Purchases stay disabled.
          flutter build appbundle --release --build-number="$SOUL_INTERNAL_VERSION_CODE" \
            --dart-define=BILLING_PACKAGE_NAME=com.soulreader.soul_reader
      - name: Verify signed bundle and original audio
        run: |
          set -euo pipefail
          bundle=build/app/outputs/bundle/release/app-release.aab
          python3 scripts/verify_assets.py "$bundle"
          java -Duser.language=en -Duser.country=US -m jdk.jartool/sun.security.tools.jarsigner.Main -verify -verbose -certs "$bundle" > "$RUNNER_TEMP/soul-jar-verify.log" 2>&1
          if ! grep -q '^jar verified\.$' "$RUNNER_TEMP/soul-jar-verify.log" || grep -qi 'unsigned entries' "$RUNNER_TEMP/soul-jar-verify.log"; then
            echo 'Bundle signature verification failed or contains unsigned entries.' >&2
            exit 1
          fi
          keytool -exportcert -keystore "$SOUL_UPLOAD_KEYSTORE_PATH" -alias "$SOUL_UPLOAD_KEY_ALIAS" \
            -storepass:env SOUL_UPLOAD_KEYSTORE_PASSWORD > "$RUNNER_TEMP/soul-upload-cert.der"
          keytool -J-Duser.language=en -J-Duser.country=US -printcert -file "$RUNNER_TEMP/soul-upload-cert.der" > "$RUNNER_TEMP/soul-upload-cert-info.txt"
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/soul-upload-cert-info.txt"; then
            echo 'Android debug certificates cannot be used for this upload.' >&2
            exit 1
          fi
          keytool -printcert -jarfile "$bundle" -rfc > "$RUNNER_TEMP/soul-bundle-cert.pem"
          python3 - <<'PY'
          import base64, hashlib, os, re, zipfile
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          text = (temp / 'soul-bundle-cert.pem').read_text()
          certificates = re.findall(r'-----BEGIN CERTIFICATE-----\s*(.*?)\s*-----END CERTIFICATE-----', text, re.S)
          if not certificates:
              raise SystemExit('No bundle signing certificate found')
          leaf = base64.b64decode(re.sub(r'\s+', '', certificates[0]), validate=True)
          if leaf != (temp / 'soul-upload-cert.der').read_bytes():
              raise SystemExit('Bundle signing certificate does not match upload key')
          with zipfile.ZipFile('build/app/outputs/bundle/release/app-release.aab') as archive:
              required = {'BundleConfig.pb', 'base/manifest/AndroidManifest.xml'}
              if not required.issubset(archive.namelist()):
                  raise SystemExit('Not an Android App Bundle')
          print('Verified upload certificate SHA-256: ' + hashlib.sha256(leaf).hexdigest())
          PY
      - name: Stage only the internal AAB and checksum
        run: |
          set -euo pipefail
          output="SOUL_READER_8.5.6_INTERNAL_PAYMENT_PREP_${SOUL_INTERNAL_VERSION_CODE}.aab"
          cp build/app/outputs/bundle/release/app-release.aab "$output"
          sha256sum "$output" > "${output}.sha256"
          echo 'Internal payment-preparation AAB only. Login, backend verification and live purchases are not connected.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish internal AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOUL_READER_8.5.6_INTERNAL_PAYMENT_PREP_AAB
          path: |
            SOUL_READER_8.5.6_INTERNAL_PAYMENT_PREP_*.aab
            SOUL_READER_8.5.6_INTERNAL_PAYMENT_PREP_*.aab.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Remove private signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/soul-play-upload.jks" android/key.properties
