name: Build SOUL READER Android test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter stable (Dart 3.12 or newer required)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Print Flutter version
        run: flutter --version
      - name: Prepare Android without changing Flutter sources
        run: bash scripts/prepare_android.sh
      - name: Verify original audio files
        run: python3 scripts/verify_assets.py
      - name: Dart static analysis
        run: flutter analyze --no-fatal-infos
      - name: Build signed debug APK for Galaxy installation
        run: flutter build apk --debug
      - name: Verify APK audio and signature
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_assets.py build/app/outputs/flutter-apk/app-debug.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$apksigner" verify --verbose build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk SOUL_READER_7.3.apk
          sha256sum SOUL_READER_7.3.apk > SOUL_READER_7.3.apk.sha256
      - name: Publish installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOUL_READER_7.3_Galaxy_APK
          path: |
            SOUL_READER_7.3.apk
            SOUL_READER_7.3.apk.sha256
          if-no-files-found: error
          retention-days: 30
