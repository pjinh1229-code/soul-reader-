name: soul_reader
description: SOUL READER native Android/iOS ML Kit face detection prototype.
publish_to: none
version: 8.5.5+92

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_face_detection: ^0.15.1
  image_picker: ^1.2.4
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/index.html
    - assets/web/icon-192.png
    - assets/web/icon-512.png
    - assets/web/audio/
    - assets/web/audio/ko/
    - assets/web/audio/en/
    - assets/web/audio/ja/
