name: soul_reader
description: SOUL READER native Android/iOS ML Kit face detection prototype.
publish_to: none
version: 8.5.6+96

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_face_detection: ^0.15.1
  image_picker: ^1.2.4
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  path_provider: ^2.1.5
  in_app_purchase: 3.3.1
  in_app_purchase_android: 0.5.5
  google_sign_in: 7.2.0
  firebase_auth: 7.0.1
  firebase_core: 5.1.0
  crypto: 3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/firebase/
    - assets/web/index.html
    - assets/web/billing.js
    - assets/web/icon-192.png
    - assets/web/icon-512.png
    - assets/web/audio/
    - assets/web/audio/ko/
    - assets/web/audio/en/
    - assets/web/audio/ja/
